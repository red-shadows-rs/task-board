name: Feature request
description: Suggest an improvement for TaskBoard
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or friction does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would change in the UI, API, or data layer?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you evaluate, and why is this one better?

  - type: markdown
    attributes:
      value: |
        ---
        **Out of scope:** features unrelated to bilingual (en/ar) team task management.
